name: 테스트

on:
  push:
    paths-ignore:
      - "docs/festivals.json"
      - "data/geocode_cache.json"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 파이프라인 시나리오 (pytest-bdd)
        run: |
          pip install -r requirements-dev.txt
          pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 화면 표시 규칙 시나리오 (cucumber-js)
        run: |
          npm ci
          npm test
